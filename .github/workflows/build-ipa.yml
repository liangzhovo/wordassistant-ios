name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Prepare dictionary DB (release full / fallback small)
        run: bash ios-app/scripts/fetch-db.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show DB size
        run: |
          ls -lh "android-app/app/src/main/assets/简明英汉字典增强版.db"
          echo "磁盘剩余: $(df -h / | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build archive (unsigned)
        working-directory: ios-app
        run: |
          xcodebuild archive \
            -project WordAssistant.xcodeproj \
            -scheme WordAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/WordAssistant.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
          echo "--- archive 内容 ---"
          ls -lh build/WordAssistant.xcarchive/Products/Applications/

      - name: Package unsigned IPA
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP="build/WordAssistant.xcarchive/Products/Applications/WordAssistant.app"
          test -d "$APP" || { echo "WordAssistant.app 缺失"; exit 1; }
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build/Payload && zip -r -y -X ../../WordAssistant-unsigned.ipa WordAssistant.app)
          ls -lh WordAssistant-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordAssistant-unsigned-ipa
          path: ios-app/WordAssistant-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
