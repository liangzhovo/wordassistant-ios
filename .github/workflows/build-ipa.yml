name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Prepare dictionary DB (release full / fallback small)
        run: bash ios-app/scripts/fetch-db.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show DB size
        run: |
          ls -lh "android-app/app/src/main/assets/简明英汉字典增强版.db"
          echo "磁盘剩余: $(df -h / | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Diagnose Xcode environment
        run: |
          xcode-select -p
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: Generate Xcode project
        working-directory: ios-app
        run: |
          xcodegen generate
          # 强制工程格式兼容 runner 默认 Xcode 15.4（XcodeGen 2.46 会生成 Xcode 16 的格式 77）
          perl -0777 -pi -e 's/objectVersion = \d+;/objectVersion = 56;/g; s/[ \t]*preferredProjectObjectVersion = \d+;//g' WordAssistant.xcodeproj/project.pbxproj
          echo "--- objectVersion after patch ---"
          grep -E "objectVersion|preferredProjectObjectVersion" WordAssistant.xcodeproj/project.pbxproj || true

      - name: Build archive (unsigned)
        working-directory: ios-app
        run: |
          xcodebuild archive \
            -project WordAssistant.xcodeproj \
            -scheme WordAssistant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/WordAssistant.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
          echo "--- archive 内容 ---"
          ls -lh build/WordAssistant.xcarchive/Products/Applications/

      - name: Package unsigned IPA
        working-directory: ios-app
        run: |
          set -euo pipefail
          APP="build/WordAssistant.xcarchive/Products/Applications/WordAssistant.app"
          test -d "$APP" || { echo "WordAssistant.app 缺失"; exit 1; }
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          # 标准 IPA 结构：压缩包根必须为 Payload/（否则签名工具报 "No Payload directory"）
          (cd build && zip -r -y -X ../WordAssistant-unsigned.ipa Payload)
          ls -lh WordAssistant-unsigned.ipa
          echo "--- 校验 IPA 结构 ---"
          unzip -l WordAssistant-unsigned.ipa | grep -q "Payload/WordAssistant.app/" && echo "Payload 结构 OK" || { echo "错误: IPA 缺少 Payload/ 目录"; exit 1; }

      - name: Upload IPA to GitHub Release (ipa-latest)
        working-directory: ios-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 上传到固定标签 ipa-latest，网页端/Release 链接下载很快；失败不阻断（仍有 Artifact）
          if gh release view ipa-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload ipa-latest WordAssistant-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create ipa-latest WordAssistant-unsigned.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --title "WordAssistant IPA（最新构建，未签名）" \
              --notes "由 GitHub Actions 自动构建。未签名，需用爱思助手/Sideloadly/AltStore 自签安装。"
          fi
          gh release view ipa-latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordAssistant-unsigned-ipa
          path: ios-app/WordAssistant-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
